# Скопируйте в /etc/awgram/config.toml и заполните.
# Токен лучше хранить в /etc/awgram/env (AWGRAM_TOKEN=...), а не здесь.
bot_token     = ""                              # или через env AWGRAM_TOKEN
admin_ids     = [111111111]                     # ваш Telegram user ID (узнать: @userinfobot)
manage_script = "/root/awg/manage_amneziawg.sh"
clients_dir   = "/root/awg"
sudo_prefix   = ""                              # "" если сервис от root; "sudo" для hardened-режима
op_timeout_secs = 60
state_file = "/etc/awgram/state.json"           # персистентное состояние бота: язык каждого админа + глобальный PSK-дефолт; переживает рестарт

# Путь к SQLite-базе бота (настройки, статистика, история, события).
# Каталог создаёт установщик; переживает переустановки и ребуты.
db_path = "/var/lib/awgram/awgram.db"

# Прокси до api.telegram.org — если Bot API с сервера недоступен напрямую.
# Приоритетный список: при старте берётся первый живой; если он умирает,
# бот завершается, systemd перезапускает — и выбор повторяется.
# Схемы: socks5, socks5h (DNS на стороне прокси — рекомендуется), http, https;
# логин/пароль — прямо в URL. Подробности: docs/proxy.md.
# telegram_proxies = ["socks5h://user:pass@10.8.0.1:1080", "http://10.8.0.2:3128"]
