[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2026-0173: proc-macro-error2 помечен как unmaintained (не vulnerability,
# без CVE/эксплойта). Приходит транзитивно через aquamarine <- teloxide и
# используется только на этапе компиляции (proc-macro для doc-комментариев),
# рантайм-поверхности атаки нет. Апстрим-замены на дату проверки (2026-07-14) нет.
#
# RUSTSEC-2026-0543: chrono помечен как unmaintained (не vulnerability, без
# CVE; затронуты все версии, исправленной нет). Убрать его из дерева нельзя:
# кроме самого бота (локальное время в расписании и подписях бэкапов) крейт тянет
# teloxide-core. Пересмотреть, когда teloxide перейдёт на jiff/time, — тогда
# же перевести бота и снять запись. Дата проверки: 2026-11-17.
ignore = [
  { id = "RUSTSEC-2026-0173", reason = "unmaintained proc-macro (compile-time only) via aquamarine <- teloxide; no CVE, no fix available upstream" },
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained (no CVE, no fixed version); required by teloxide-core, cannot be dropped until teloxide migrates" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
]

# ring не декларирует SPDX-лицензию в Cargo.toml — уточняем вручную (стандартный сниппет).
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]
